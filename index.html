<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSI Finance & HR</title>
    <style>
      html,body,#root{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .boot{min-height:100vh;display:grid;place-items:center;background:#102b55;color:#fff;text-align:center}
      .boot-card{max-width:520px;padding:32px}
      .boot h1{margin:0 0 8px;font-size:24px}.boot p{margin:0;color:#b9cbe6;line-height:1.5}
      .boot-error{background:#fff;color:#172033;padding:24px;border-radius:14px;text-align:left}
      .boot-error h2{margin-top:0;color:#102b55}
      .boot-error pre{white-space:pre-wrap;overflow:auto;font-size:12px}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-card">
          <h1>VSI Finance & HR</h1>
          <p>Loading secure workspace…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
